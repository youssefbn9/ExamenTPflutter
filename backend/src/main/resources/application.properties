# Port du serveur
server.port=8080

# Base de donnees H2 locale (fichier)
spring.datasource.url=jdbc:h2:file:./data/scol_a7;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration MySQL (decommenter pour basculer vers MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/scol_a7?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

# Console H2 et JPA
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Initialisation SQL (data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Format ISO pour les dates LocalDate
spring.jackson.serialization.write-dates-as-timestamps=false
